name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Download nltk cmudict
        run: python -m nltk.downloader cmudict

      - name: Run pre-commit hooks (black, isort, flake8, mypy)
        uses: pre-commit/action@v3.0.1

      - name: Run tests with coverage (threshold >= 80%, см. ТЗ п.5.2)
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t text-analyzer:ci .
