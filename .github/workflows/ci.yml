name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-commit hooks (black, isort, flake8, mypy)
        uses: pre-commit/action@v3.0.1

      - name: Run tests with coverage (threshold >= 80%)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80
