name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-commit hooks with auto-fixes
        uses: pre-commit/action@v3.0.1
        continue-on-error: true

      - name: Commit and push fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: auto-fix code formatting with pre-commit hooks"
            git push
          fi

      - name: Run tests with coverage (threshold >= 80%)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80
