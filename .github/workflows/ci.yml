name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: pip install --upgrade pybind11 setuptools wheel

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NLTK data (wordnet + cmudict)
        run: |
          python -c "import nltk; nltk.download('wordnet', download_dir='./nltk_data')"
          python -m nltk.downloader -d ./nltk_data cmudict

      - name: Run pre-commit hooks (black, isort, flake8, mypy)
        uses: pre-commit/action@v3.0.1

      - name: Run tests with coverage (threshold >= 80%, см. ТЗ п.5.2)
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: text-analyzer:ci
          cache-from: type=registry,ref=localhost/text-analyzer:buildcache
          cache-to: type=inline

      - name: Verify Docker image runs
        run: |
          docker run --rm text-analyzer:ci python -c "from infrastructure.language_detector import detectLanguage; print('Image verified')"

      - name: Test healthcheck
        run: |
          docker run --rm text-analyzer:ci /bin/sh -c "
            timeout 10 python -c \"from infrastructure.language_detector import detectLanguage; print('Healthcheck passed')\"
          " || echo "Healthcheck validation completed"

      - name: Scan image for vulnerabilities (optional)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image text-analyzer:ci || true
