<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализ текста</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      color: #312e81;
    }

    section {
      margin-bottom: 24px;
      padding: 24px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      font: inherit;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      background: #4f46e5;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .hint {
      color: #6b7280;
      font-size: 14px;
    }

    pre {
      overflow-x: auto;
      padding: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      white-space: pre-wrap;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <main>
    <h1>Анализ текста</h1>

    <section>
      <h2>Один текст</h2>
      <label for="singleText">Введите текст:</label>
      <textarea id="singleText"></textarea>
      <button id="analyzeButton" type="button">Анализировать</button>
      <pre id="singleResult">Результат появится здесь.</pre>
    </section>

    <section>
      <h2>Несколько текстов</h2>
      <label for="batchText">Введите каждый текст с новой строки:</label>
      <textarea id="batchText"></textarea>
      <p class="hint">Каждая непустая строка будет проанализирована как отдельный текст.</p>
      <button id="analyzeBatchButton" type="button">Анализировать список</button>
      <pre id="batchResult">Результат появится здесь.</pre>
    </section>
  </main>

  <script>
  #получение элементов страницы. Переменные хранят ссылки.
    const singleText = document.getElementById('singleText');
    const batchText = document.getElementById('batchText');
    const singleResult = document.getElementById('singleResult');
    const batchResult = document.getElementById('batchResult');
    const analyzeButton = document.getElementById('analyzeButton');
    const analyzeBatchButton = document.getElementById('analyzeBatchButton');

    async function sendRequest(endpoint, requestBody, resultElement) {
      # Отправляет запрос к API и показывает полученный JSON.
      resultElement.classList.remove('error');
      resultElement.textContent = 'Загрузка...';

      try {
      # С помощью fetch отправляется запрос.
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });
        # Получаем ответ.
        const responseData = await response.json();
        resultElement.textContent = JSON.stringify(responseData, null, 2);

        if (!response.ok) {
          resultElement.classList.add('error');
        }
      } catch (error) {
        resultElement.classList.add('error');
        resultElement.textContent = 'Не удалось подключиться к серверу.';
      }
    }

    function analyzeText() {
      // Отправляет один текст на эндпоинт /analyze.
      sendRequest(
        '/analyze',
        { text: singleText.value },
        singleResult
      );
    }

    function analyzeBatch() {
      // Преобразует строки в массив и отправляет его на /analyze-batch.
      const texts = batchText.value
        .split('\n')
        .map((text) => text.trim())
        .filter((text) => text.length > 0);

      sendRequest(
        '/analyze-batch',
        { texts: texts },
        batchResult
      );
    }

    analyzeButton.addEventListener('click', analyzeText);
    analyzeBatchButton.addEventListener('click', analyzeBatch);
  </script>
</body>
</html>
