
  <!DOCTYPE html>
  <html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>Анализ текста</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        font-family: Arial, sans-serif;
        color: #1f2937;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
      }

      main {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 36px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(30, 41, 59, 0.12);
      }

      h1 {
        margin: 0 0 28px;
        color: #312e81;
        font-size: 32px;
      }

      h2 {
        margin: 32px 0 12px;
        font-size: 20px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        min-height: 200px;
        padding: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font: inherit;
        line-height: 1.5;
        resize: vertical;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      textarea:focus {
        border-color: #6366f1;
        outline: none;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      }

      button {
        margin-top: 18px;
        padding: 12px 22px;
        border: none;
        border-radius: 10px;
        color: #ffffff;
        background: #4f46e5;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }

      button:hover {
        background: #4338ca;
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      pre {
        min-height: 100px;
        margin: 0;
        padding: 18px;
        overflow-x: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        color: #334155;
        background: #f8fafc;
        line-height: 1.5;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px 12px;
        }

        main {
          padding: 24px 18px;
        }

        h1 {
          font-size: 26px;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Анализ текста</h1>

      <label for="textInput">
        Введите текст:
      </label>

      <textarea
        id="textInput"
        rows="10"
        cols="60"
        placeholder="Введите текст для анализа"
      ></textarea>

      <button id="analyzeButton" type="button">
        Анализировать
      </button>

      <h2>Результат</h2>

      <pre id="resultOutput">Результат пока отсутствует.</pre>
    </main>
    <script>
    const textInput = document.getElementById('textInput');
    const analyzeButton = document.getElementById('analyzeButton');
    const resultOutput = document.getElementById('resultOutput');

    async function sendAnalyzeRequest() {
      // Получает текст из поля ввода.
      const text = textInput.value;

      if (!text.trim()) {
        resultOutput.textContent = 'Введите непустой текст.';
        return;
      }

      resultOutput.textContent = 'Выполняется анализ...';

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            text: text
          })
        });

        const responseData = await response.json();

        if (!response.ok) {
          resultOutput.textContent =
            'Ошибка ' + response.status + ':\n' +
            JSON.stringify(responseData, null, 2);
          return;
        }

        resultOutput.textContent = JSON.stringify(
          responseData,
          null,
          2
        );
      } catch (error) {
        resultOutput.textContent =
          'Не удалось отправить запрос к API.';
      }
    }

    analyzeButton.addEventListener(
      'click',
      sendAnalyzeRequest
    );
  </script>
  </body>
  </html>
